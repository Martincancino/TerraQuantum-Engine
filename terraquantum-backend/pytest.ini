[pytest]
testpaths = tests scripts/validation
addopts = -v --tb=short
markers =
    slow: tests que tardan más de 10s
    integration: tests que escriben a disco (crean archivos en data/projects/)
    unit: tests rápidos sin I/O ni cómputo pesado
    benchmark: benchmarks científicos con ground truth analítico; CI falla si métricas de recuperación degradan
    validation: F9 — regresión física a demanda (re-invierte el motor real, minutos). Se salta salvo TQ_RUN_VALIDATION=1 o --run-validation
