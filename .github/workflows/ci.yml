name: TerraQuantum CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraquantum-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: terraquantum-backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Compile check (syntax errors)
        run: python -m compileall api services exploration schemas Camiones core middleware workers

      - name: Full pytest suite (excluding slow tests, ~900 tests, ~25 min)
        # Ejecuta todos los tests EXCEPTO los marcados como @pytest.mark.slow.
        # Incluye unit + integration + benchmark + todos los demás.
        # Los tests lentos (>10s) se ejecutan localmente pero no en CI para mantener tiempo <30min.
        run: pytest tests/ -m "not slow" -v --tb=short -x

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraquantum-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: terraquantum-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
