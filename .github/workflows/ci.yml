name: TerraQuantum CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraquantum-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: terraquantum-backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Compile check (syntax errors)
        run: python -m compileall api services exploration schemas Camiones core middleware workers

      - name: Unit tests
        run: pytest tests/ -m "unit" -v

      - name: Integration tests
        run: pytest tests/ -m "integration" -v

      - name: Scientific Benchmarks (HITO 4)
        # Falla si la recuperación esférica o de prisma supera el 10% de error.
        # Ningún test debe usar la misma malla para forward e inversión (anti-inverse-crime).
        run: pytest tests/ -m "benchmark" -v --tb=long

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraquantum-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: terraquantum-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
