name: TerraQuantum CI

on:
  push:
    # `**`, no `*`. En los filtros de GitHub Actions `*` NO cruza la barra: con
    # `["*"]`, un push a `fix/lo-que-sea` o `feature/x` no disparaba NADA y sólo
    # se enteraba uno al abrir el PR. Una red de seguridad que no cubre el nombre
    # de rama que más se usa no es una red de seguridad.
    branches: ["**"]
  pull_request:
    branches: ["main"]
  schedule:
    # 04:30 UTC = 00:30 en Chile continental (invierno). La regresión física
    # completa cuesta entre 33 min y 6,9 h MEDIDOS en dos corridas del propio
    # gate, así que no cabe en un PR: va de noche.
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraquantum-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Fase 3: el intérprete NO se escribe a mano aquí. Se lee del mismo
          # archivo que declara el que se empaqueta en el instalador. Antes la
          # CI fijaba 3.11 y, como `zarr==3.2.1` exige >=3.12, pip resolvía un
          # MAJOR DISTINTO de zarr: la CI validaba un árbol de dependencias que
          # nunca llega al cliente. Si la versión no existe en el runner, este
          # paso falla ruidosamente — que es lo correcto.
          python-version-file: terraquantum-backend/.python-version
          cache: pip
          cache-dependency-path: terraquantum-backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Compile check (syntax errors)
        # Fase 3 (H-5): antes esta línea compilaba `Camiones` y `workers`, que no
        # existen. `compileall` avisa por stdout y devuelve 0, así que la CI pasaba
        # en verde compilando seis paquetes de los ocho que decía compilar.
        # El script contrasta los paquetes declarados con los que hay en disco.
        run: python scripts/ci/compile_check.py

      - name: Guardas de arquitectura (capas, complejidad, inventario, dependencias, configuración)
        # Las puertas de la Fase 3 que no dependen de correr física:
        #  · presupuestos AST: la Fase 8 no puede deshacerse sola con el tiempo.
        #  · inventario: cada script de validation/ declara si decide o sólo mide (H-22).
        #  · cierre de dependencias: el código no importa nada que este job no instale.
        #    Se añadió al CERRAR la fase, después de medir que `psutil` había dejado de
        #    ser instalable (se caía de rebote con `distributed`, que la Fase 6 quitó) y
        #    que eso ponía 6 tests en rojo en un runner limpio. Aquí es casi un no-op
        #    —lo instalado ES el cierre—; su trabajo lo hace en la máquina de desarrollo
        #    vía check.ps1, ANTES del push.
        #  · tests: capas, guardas de CI, contabilidad del gate F9 y calibración absoluta.
        #  · superficie de configuración (Fase 5, H-11): censa por AST las 42 variables
        #    de entorno del backend y falla si aparece una nueva sin declarar — que es
        #    el criterio de aceptación de esa fase. Va AQUÍ y no en el paso de suite
        #    porque cuatro de sus tests llevan marca `slow` (invierten de verdad para
        #    demostrar que las perillas del solver no son decorativas) y `-m "not slow"`
        #    los deselecciona. Sin filtro corren, y el archivo entero mide 1 min 38 s.
        #  · duplicación estructural (Fase 7, H-9): mide las ventanas duplicadas entre
        #    los dos motores de física y falla si suben. La fase las bajó de 192 a 20;
        #    el criterio de aceptación era <40. El gate existe porque el informe citaba
        #    un `study_duplication.py` que NUNCA estuvo en el repositorio: sin medidor,
        #    el criterio no era verificable y la duplicación podía volver sin ruido.
        #  · deriva de contratos (Fase 10, H-16): `--check` regenera los tipos del
        #    frontend desde el OpenAPI y compara con lo commiteado. Va en el job de
        #    BACKEND porque es aquí donde vive la app que produce el esquema (y donde
        #    no hay Node). Rojo aquí = alguien cambió un contrato y los tipos del
        #    frontend describen un backend que ya no existe. El resto de guardas de
        #    esa fase (no filtrar/no inyectar campos, espejos del sniffer y del plan
        #    de mapeo, presupuesto de `useState`, contratos sin copiar a mano) van en
        #    el pytest de abajo, que también cruza a `terraquantum-web` como el de la
        #    Fase 9.
        run: |
          python scripts/ci/ast_budgets.py
          python scripts/ci/validation_inventory.py
          python scripts/ci/deps_closure.py
          python scripts/ci/study_duplication.py --gate
          python scripts/ci/generate_frontend_types.py --check
          pytest tests/test_fase3_capas.py tests/test_fase3_ci_guards.py tests/test_fase3_presupuestos_ast.py tests/test_fase3_f9_no_evaluado.py tests/test_fase3_calibracion_absoluta.py tests/test_fase5_superficie_config.py tests/test_fase7_nucleo_compartido.py tests/test_fase8_espina_dorsal.py tests/test_fase9_camino_de_usuario.py tests/test_fase10_contratos.py tests/test_fase13_undo_redo.py -q

      - name: Canario de física (regresión W_z sobre esfera sintética)
        # H-4: la regresión física NUNCA corría automáticamente. Y el arreglo no
        # era "poner TQ_RUN_VALIDATION=1 en el paso de tests": MEDIDO, los 8
        # tests `validation` llevan TAMBIÉN el marcador `slow`, así que
        # `-m "not slow"` los deselecciona antes de que el skip de conftest
        # entre en juego. Hay que invocarlos por nodeid y sin ese filtro.
        # Se elige el sintético porque es el único caso sin datos externos y con
        # coste acotado (2,5 s declarados; 38 s medidos en una máquina cargada).
        # El resto de la suite física va en el job nocturno.
        #
        # LÍMITE MEDIDO de este canario (2026-08-13, al cerrar la fase). Sólo ve
        # regresiones de FORMA. Se mutó el motor y se midió el veredicto:
        #   · lambda_spatial × 500  → FALLA  (lo ve)
        #   · G a 7.00000e-11 (+4,9%) → PASA (ciego: el benchmark genera el dato
        #     sintético con la misma constante con la que invierte, así que se cancela)
        #   · W_z apagado            → PASA  (ciego; y es justo lo que su nota decía
        #     vigilar — `depth_beta` resultó inerte, medido en el Punto 4)
        # Por eso las regresiones de ESCALA las cubre `test_fase3_calibracion_absoluta.py`
        # en el paso anterior, contra verdad analítica y sin inversión.
        env:
          TQ_RUN_VALIDATION: "1"
        timeout-minutes: 15
        run: pytest tests/test_f9_physics_regression.py::test_synthetic_sphere_recovery -q

      - name: Suite de tests
        # MEDIDO 2026-08-11: `-m "not slow"` selecciona 2256 de 2290 tests (sólo
        # 34 quedan fuera), y la suite completa tarda ~60 min en una máquina de
        # desarrollo. El comentario anterior decía "~900 tests, ~25 min": la
        # marca `slow` dejó de separar nada hace tiempo. Se mantiene el filtro
        # porque lo que excluye (soak, matriz E2E, presupuestos de rendimiento)
        # sí es caro, pero el coste real de este paso es del orden de la hora.
        run: pytest tests/ -m "not slow" --tb=short -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraquantum-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: terraquantum-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: El navegador no conoce la URL del backend (Fase 2, H-21)
        # Guarda estática: si alguien vuelve a llamar al backend directo desde
        # código de cliente, la única puerta deja de ser el proxy — y con puertos
        # alternativos, esa llamada apuntaría a otro proceso.
        run: node scripts/check_client_backend_calls.mjs

      - name: Build
        run: npm run build

  # ── Regresión física completa: sólo de noche o a mano ───────────────────────
  # H-4 cerrado del todo. Este job es el que "congela la física", y su honestidad
  # depende de dos cosas que hay que leer juntas:
  #
  #   1. COSTE MEDIDO. Los dos reportes guardados del propio gate dan 1.972 s
  #      (33 min) y 24.852 s (6,9 h) para el MISMO veredicto PASS: DO-27 domina y
  #      su coste no es reproducible. Los runners alojados de GitHub matan un job
  #      a las 6 h, así que en su régimen lento este job morirá por timeout. Eso
  #      es información, no ruido: dirá que el caso caro se salió de presupuesto.
  #   2. DATOS. DO-27 y Raglan ya estaban versionados. San Nicolás y LdM vivían
  #      sólo bajo data/projects/ (excluido por .gitignore), así que en un
  #      checkout limpio no existían: se copiaron sus observaciones —122 KB, y
  #      un test comprueba que son IDÉNTICAS a la corrida canónica— a
  #      tests/fixtures/f9/. Con eso el nocturno evalúa los 6 casos. El gate
  #      sigue sabiendo distinguir "no evaluado" de "regresión" por si alguna
  #      fixture desaparece.
  physics-regression-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330   # por debajo del tope de 6 h de los runners alojados
    defaults:
      run:
        working-directory: terraquantum-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: terraquantum-backend/.python-version
          cache: pip
          cache-dependency-path: terraquantum-backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Ingesta generativa a fondo (N grande)
        # CORRECCIÓN MEDIDA a la auditoría: decía que el generativo estaba "fuera
        # de la CI por tiempo". No lo está — `test_ingesta_generativa.py` no
        # lleva marca `slow`, así que la selección `-m "not slow"` del job de PR
        # ya lo ejecuta con su default de 400 casos. Lo que faltaba era la pasada
        # LARGA, que es esto. `TQ_GEN_N` ya existía como perilla.
        env:
          TQ_GEN_N: "5000"
        timeout-minutes: 60
        run: pytest tests/test_ingesta_generativa.py -q

      - name: Tests `validation` que ningún otro job ejecuta
        # El diseño de la fase pedía `pytest -m validation` entero. No estaba: los 8
        # tests `validation` llevan también `slow`, así que el job de PR los deselecciona
        # y el gate F9 de abajo es main()-only —no invoca pytest—, de modo que de los 8
        # sólo corría UNO (el canario, por nodeid). Los 5 de `test_f9_physics_regression`
        # los cubre en sustancia el gate (mismos datasets, mismo motor); los 2 de
        # `test_depth_prior_service` no los cubría NADA.
        # MEDIDO 2026-08-13: 8 min 09 s, ambos pasan.
        # `tests/test_fase3_ci_guards.py` vigila que esta lista no se quede corta cuando
        # alguien añada un test `validation` nuevo.
        env:
          TQ_RUN_VALIDATION: "1"
        timeout-minutes: 45
        run: pytest tests/test_depth_prior_service.py -m validation -q

      - name: Byte-identidad de los dos motores (Fase 7)
        # Criterio de aceptación (b) de la Fase 7: «un solo bit de diferencia ⇒
        # revertir». 34 configuraciones que recorren las ramas que la extracción
        # compartida toca en los DOS motores —incluidas las rutas A y B del funcional
        # magnético (H-33) y el solver Octree—, comparadas por SHA-256 sobre los bits
        # de float64. Va en el nocturno y no en el job de PR porque re-invierte de
        # verdad; en la máquina de desarrollo se corre a mano antes de tocar el motor:
        #     python scripts/validation/fase7_byte_identity.py --check
        # Una tolerancia esconderia justo el error que esta fase podia introducir
        # (reordenar una multiplicacion cambia el ultimo bit, no el tercer decimal).
        timeout-minutes: 30
        run: python scripts/validation/fase7_byte_identity.py --check

      - name: Byte-identidad del orquestador y del endpoint (Fase 8)
        # El arnés de la Fase 7 mide los MOTORES y NO defiende lo que la Fase 8
        # toca: se comprobó mutilando `run_geophysics_inversion` y dio 34/34 en
        # verde. Éste llama al servicio y al endpoint reales sobre 28
        # configuraciones y compara SHA-256 del payload canonicalizado Y de los
        # bits de las columnas numéricas del parquet que queda en disco.
        # Aísla el disco con TERRAQUANTUM_DATA_DIR y neutraliza el enriquecimiento
        # R3 (sale a la red por el DEM): un gate de byte-identidad que depende de
        # internet cría lobos y acaba desactivado.
        timeout-minutes: 45
        run: python scripts/validation/fase8_byte_identity.py --check

      - name: Gate F9 (re-invierte el motor real sobre los datasets canónicos)
        env:
          TQ_RUN_VALIDATION: "1"
        run: python scripts/validation/f9_gate_regression.py

      - name: Publicar el reporte aunque el gate falle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f9-regression-report
          path: |
            terraquantum-backend/scripts/validation/f9_gate_report.json
            terraquantum-backend/scripts/validation/f9_validation_report.html
          if-no-files-found: warn
