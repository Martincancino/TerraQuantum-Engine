name: TerraQuantum CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraquantum-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: terraquantum-backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Compile check (syntax errors)
        run: python -m compileall api services exploration schemas Camiones core

      - name: Run pytest
        run: pytest tests/ -v

      - name: Run Geophysics Benchmark (Strict)
        run: python tests/synthetic_recovery_benchmark.py --ci --no-focusing --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraquantum-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: terraquantum-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
