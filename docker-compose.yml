version: "3.9"

services:
  backend:
    build:
      context: ./terraquantum-backend
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      - TERRAQUANTUM_HOST=0.0.0.0
      - TERRAQUANTUM_PORT=8010
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - CSV_MAX_BYTES=10485760
      # Optional GEE: mount credentials and set this only outside git.
      # - GEE_CREDENTIALS_PATH=/app/credenciales_gee.json
    volumes:
      - ./terraquantum-backend/data:/app/data
      - ./terraquantum-backend/tmp:/app/tmp
      - ./terraquantum-backend/public:/app/public
      # Optional GEE credentials mount:
      # - ./credenciales_gee.json:/app/credenciales_gee.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./terraquantum-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - TERRAQUANTUM_BACKEND_URL=http://backend:8010
      - NEXT_PUBLIC_TERRAQUANTUM_BACKEND_URL=http://localhost:8010
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
