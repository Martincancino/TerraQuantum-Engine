<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TerraQuantum</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1020; color: #e6ecff;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
    .wrap { height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1.4rem; }
    .logo { font-size: 2rem; font-weight: 700; letter-spacing: .04em; }
    .logo span { color: #5eead4; }
    .msg { color: #9fb0d0; font-size: .95rem; }
    .bar { width: 220px; height: 4px; border-radius: 4px; background: #1b2440; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 40%; border-radius: 4px;
      background: linear-gradient(90deg, #5eead4, #6366f1);
      animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Terra<span>Quantum</span></div>
    <div class="bar"><i></i></div>
    <div class="msg">Iniciando el motor local… tus datos no salen de esta máquina.</div>
  </div>
</body>
</html>
